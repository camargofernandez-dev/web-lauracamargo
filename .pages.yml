media:
  input: media
  output: /media

content:
  - name: sitio
    label: Datos generales y Sobre mí
    type: file
    path: content/sitio.json
    format: json
    fields:
      - { name: nombre, label: Nombre, type: string }
      - { name: cargo, label: "Cargo (aparece encima de tu nombre)", type: string }
      - { name: titular, label: Frase principal de la portada, type: text }
      - { name: presentacion, label: Presentación (página de inicio), type: text }
      - { name: foto, label: Foto principal (portada), type: image }
      - { name: foto_secundaria, label: Foto de la página Sobre mí, type: image }
      - { name: biografia, label: "Biografía (página Sobre mí). Separa párrafos con una línea en blanco", type: text }
      - { name: cv, label: CV en PDF, type: file }
      - { name: email, label: Correo de contacto, type: string }
      - { name: texto_contacto, label: Texto de la página de contacto, type: text }
      - name: enlaces
        label: Perfiles (ORCID, Google Scholar, LinkedIn...)
        type: object
        list: true
        fields:
          - { name: nombre, label: Nombre, type: string }
          - { name: url, label: Enlace, type: string }

  - name: investigacion
    label: Investigación
    type: file
    path: content/investigacion.json
    format: json
    fields:
      - { name: introduccion, label: Introducción, type: text }
      - name: lineas
        label: Líneas de investigación
        type: object
        list: true
        fields:
          - { name: titulo, label: Título, type: string }
          - { name: resumen, label: Resumen corto, type: text }
          - { name: descripcion, label: "Descripción completa. Separa párrafos con una línea en blanco", type: text }
      - name: publicaciones
        label: Publicaciones
        type: object
        list: true
        fields:
          - { name: anio, label: Año, type: string }
          - { name: autores, label: "Autores (p. ej. Camargo, L. y Méndez, B.)", type: string }
          - { name: titulo, label: Título, type: text }
          - { name: fuente, label: "Revista o libro, volumen y páginas", type: text }
          - name: tipo
            label: Tipo
            type: select
            options:
              values: [Libro, Artículo, Capítulo de libro, Tesis doctoral]
          - name: linea
            label: Línea de investigación
            type: select
            options:
              values: ["Discurso de la extrema derecha y trumpismo discursivo", "Sociolingüística del español en Mallorca", "Representación del discurso y cita en la narración oral", "Pragmática y análisis de la conversación", "Rap y discurso de los jóvenes", "Competencia pragmática y TEA"]
          - { name: enlace, label: Enlace o DOI (opcional), type: string }
      - name: proyectos
        label: Proyectos financiados
        type: object
        list: true
        fields:
          - { name: periodo, label: "Periodo (p. ej. 2024-2028)", type: string }
          - { name: titulo, label: Título, type: text }
          - { name: investigadores, label: Investigación principal, type: string }
          - { name: financiacion, label: Financiación, type: string }
          - { name: codigo, label: Código, type: string }

  - name: libro
    label: El libro
    type: file
    path: content/libro.json
    format: json
    fields:
      - { name: titulo, label: Título, type: string }
      - { name: subtitulo, label: Subtítulo, type: string }
      - { name: editorial, label: Editorial, type: string }
      - { name: anio, label: Año, type: string }
      - { name: portada, label: Portada, type: image }
      - { name: gancho, label: Frase gancho, type: text }
      - { name: sinopsis, label: Sinopsis, type: text }
      - { name: fragmento, label: Fragmento en PDF (opcional), type: file }
      - name: compra
        label: Dónde comprarlo
        type: object
        list: true
        fields:
          - { name: tienda, label: Tienda, type: string }
          - { name: url, label: Enlace, type: string }
      - name: resenas
        label: Reseñas y citas
        type: object
        list: true
        fields:
          - { name: cita, label: Título o cita, type: text }
          - { name: fuente, label: Autor y medio, type: string }
          - { name: enlace, label: Enlace, type: string }

  - name: medios
    label: Medios y conferencias
    type: file
    path: content/medios.json
    format: json
    fields:
      - { name: introduccion, label: "Introducción de la página Medios", type: text }
      - { name: introduccion_conferencias, label: "Introducción de la página Conferencias", type: text }
      - name: apariciones
        label: Apariciones
        type: object
        list: true
        fields:
          - name: tipo
            label: Tipo
            type: select
            options:
              values: [Entrevista, Prensa, Conferencia, Radio, Televisión, Podcast]
            description: "«Conferencia» aparece en la página Conferencias; el resto, en Medios. Las conferencias cuyo título empieza por «Presentación» se agrupan como presentaciones del libro."
          - { name: titulo, label: Título, type: string }
          - { name: medio, label: "Medio, congreso o institución", type: string }
          - { name: fecha, label: Fecha, type: date }
          - { name: enlace, label: "Enlace (si es de YouTube, se mostrará su miniatura)", type: string }
          - { name: descripcion, label: Descripción breve (opcional), type: text }
          - { name: imagen, label: "Foto (opcional; si no hay, se crea una portada con el nombre del medio)", type: image }
  - name: bkc
    label: "Cara B: BKC (easter egg de Sobre mí)"
    type: file
    path: content/bkc.json
    format: json
    fields:
      - { name: titulo, label: Título, type: string }
      - { name: subtitulo, label: Subtítulo, type: string }
      - { name: texto, label: Texto, type: text }
      - { name: foto, label: Foto, type: image }
      - { name: foto_texto, label: Descripción de la foto, type: string }
      - { name: foto_encuadre, label: "Encuadre de la foto (posición, p. ej. 50% 50%)", type: string }
      - { name: disco, label: Disco, type: string }
      - { name: anio, label: Año del disco, type: string }
      - { name: portada, label: Portada del disco (etiqueta del vinilo), type: image }
      - { name: spotify_album, label: "Código del álbum en Spotify (lo que va tras /album/ en el enlace)", type: string }
      - name: enlaces
        label: Enlaces
        type: object
        list: true
        fields:
          - { name: nombre, label: Nombre, type: string }
          - { name: url, label: URL, type: string }

  - name: tablon
    label: "Tablón social (convocatorias de Sobre mí)"
    type: file
    path: content/tablon.json
    format: json
    fields:
      - name: avisos
        label: Convocatorias (cada una es un post-it)
        description: "Las convocatorias cuya fecha ya ha pasado desaparecen solas del tablón."
        type: object
        list: true
        fields:
          - name: tipo
            label: Tipo
            type: select
            options:
              values: [Manifestación, Concentración, Conferencia, Charla, Mesa redonda, Presentación, Taller, Jornada, Acto]
          - { name: titulo, label: Título, type: string }
          - name: fecha
            label: Fecha
            type: date
            options:
              format: yyyy-MM-dd
          - { name: hora, label: "Hora (p. ej. 18:00)", type: string }
          - { name: lugar, label: "Lugar (p. ej. Plaça d'Espanya, Palma)", type: string }
          - { name: enlace, label: "Enlace para más información (opcional)", type: string }
          - name: color
            label: Color del post-it
            type: select
            options:
              values:
                - { name: amarillo, label: Amarillo }
                - { name: rosa, label: Rosa }
                - { name: verde, label: Verde }
                - { name: azul, label: Azul }
                - { name: naranja, label: Naranja }
                - { name: blanco, label: Blanco }
          - name: fecha_fin
            label: "Último día (solo si dura varios días)"
            type: date
            options:
              format: yyyy-MM-dd
      - { name: titulo, label: Título del tablón, type: string }
      - { name: subtitulo, label: Subtítulo del tablón, type: string }
      - { name: texto_vacio, label: "Texto del post-it cuando no hay convocatorias", type: string }
      - { name: maximo, label: "Número máximo de post-its visibles", type: number }
      - { name: ocultar_pasados, label: "Ocultar automáticamente las convocatorias pasadas", type: boolean }
